[project]
name = "query"
version = "0.1.0"
description = "AI support agent for SpotifyCares - intent classification, grounded replies, auto/escalate decisions"
requires-python = ">=3.12"
dependencies = [
    "lingua-language-detector>=2.2",
    "openai>=1.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
query = "query.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
