[project]
name = "query-monorepo"
version = "0.0.0"
description = "Query monorepo - AI support agent for SpotifyCares (backend + frontend)"
requires-python = ">=3.12"
dependencies = ["query"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.uv.sources]
query = { workspace = true }

[tool.uv.workspace]
members = ["apps/backend"]
